<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Financial Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: "#0C8CE9",
                hover: "#007be5",
                pressed: "#0768cf",
                accent: "#3DA3ED",
                light: "#7CC4F8",
              },
              surface: {
                DEFAULT: "#000000",
                elevated: "#2C2C2C",
                card: "#18181B",
              },
              muted: "#949494",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            borderRadius: {
              "custom-sm": ".125rem" /* 2px */,
              "custom-md": ".3125rem" /* 5px (Inputs/Buttons) */,
              "custom-lg": ".8125rem" /* 13px */,
              chip: "73px",
            },
            fontSize: {
              h1: ["14px", { lineHeight: "1.2", fontWeight: "400" }],
              body: ["11px", { lineHeight: "1.45", fontWeight: "400" }],
              "scale-12": ["12px", "1.3"],
            },
            transitionDuration: {
              sm: "100ms",
              md: "200ms",
              lg: "400ms",
            },
          },
        },
      };
    </script>
    <style>
      /* Custom focus outline based on design system rules */
      .focus-ring:focus-visible {
        outline: 1px solid #0c8ce9;
        outline-offset: 1px;
      }
    </style>
  </head>
  <body
    class="bg-black text-white font-sans antialiased min-h-screen flex flex-col justify-center items-center p-4"
  >
    <main
      class="w-full max-w-[1000px] bg-gradient-to-r from-[#0052D4] via-[#4364F7] to-[#6FB1FC] rounded-custom-lg p-6 md:p-12 flex flex-col md:flex-row items-center justify-between gap-8"
    >
      <div class="flex-1 max-w-md space-y-4">
        <h1
          class="text-2xl md:text-4xl font-semibold tracking-tight text-white leading-tight"
        >
          Your unified suite to exchange, transfer, and manage digital assets
        </h1>
        <p class="text-body text-white/80">
          Set up a verified account in moments directly from your device.
          Streamline everyday transfers with zero unnecessary friction.
        </p>

        <div class="pt-2 flex items-center gap-2">
          <input
            type="email"
            placeholder="Enter email address"
            class="bg-white text-black text-body px-3 py-2 rounded-custom-md focus-ring outline-none w-full max-w-[220px]"
          />
          <button
            class="bg-brand hover:bg-brand-hover active:bg-brand-pressed transition-colors duration-md text-white font-medium text-body px-4 py-2 rounded-custom-md focus-ring"
          >
            Get Started
          </button>
        </div>
      </div>

      <div class="Currency_converter">
        <div class="Head_Title">
          <h2>Currency Converter</h2>
          <span>Live Rate</span>
        </div>

        <div class="text card">
          <label> Amount </label>
          <div class="inputs">
            <select class="source_currency">
              <option class="GBP"><img src="BGP.avif" alt="" />GBP</option>
              <option class="USD"><img src="USD.png" alt="" /> USD</option>
              <option class="EUR"><img src="EUR.png" alt="" /> EUR</option>
            </select>
            <input type="text" value="" class="source_txt" readonly />
          </div>
        </div>

        <div class="card">
          <label>Converted to</label>
          <div class="inputs">
            <select class="convertion_txt">
              <option class="AUD"><img src="AUD1.png" alt="" /> AUD</option>
              <option class="CAD"><img src="CAD.png" alt="" /> CAD</option>
              <option class="JPY"><img src="JPY.png" alt="" /> JPY</option>
            </select>
            <input type="text" value="" class="convertion_currency" readonly />
          </div>
        </div>

        <div class="dateCard">
          <label>Execution Date</label>
            <input type="date" name="date" id="date" placeholder="" />
            <button class="Reset">Reset</button>
        </div>
    </div>

        <button
          class="w-full bg-brand hover:bg-brand-hover active:bg-brand-pressed transition-colors duration-md text-white font-medium text-body py-2.5 rounded-custom-md focus-ring"
        >
          Execute Order
        </button>
      </div>
    </main>
  </body>
</html>
